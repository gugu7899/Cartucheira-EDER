name: Gerar Cartucheira MBS.apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'assets/**'
      - '.github/workflows/build-android.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Gerar símbolo e 36 efeitos iniciais
        run: python tools/generate_assets.py
      - name: Compilar APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Preparar arquivo
        run: |
          mkdir -p dist-android
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist-android/Cartucheira MBS.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Cartucheira-MBS-Android
          path: dist-android/Cartucheira MBS.apk
          if-no-files-found: error
