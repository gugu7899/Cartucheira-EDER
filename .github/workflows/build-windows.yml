name: Gerar Cartucheira EDER.exe
on:
  workflow_dispatch:
  push:
    branches: ["main"]
jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Preparar identidade visual
        run: python -c "import base64,pathlib; p=pathlib.Path('assets/logo.png.b64'); pathlib.Path('assets/logo.png').write_bytes(base64.b64decode(p.read_text()))"
      - name: Gerar efeitos e ícone
        run: python tools/generate_assets.py
      - name: Executar testes
        run: python -m unittest discover -s tests -v
      - name: Gerar executável
        run: python -m PyInstaller --clean --noconfirm "Cartucheira EDER.spec"
      - name: Publicar executável
        uses: actions/upload-artifact@v4
        with:
          name: Cartucheira-EDER-Windows-x64
          path: dist/Cartucheira EDER.exe
          if-no-files-found: error
